spring.application.name=amigo-secreto

# Nome exibido nas telas (ex.: "Amigo Pijama da Família")
app.nome-evento=${NOME_EVENTO:Amigo Secreto}

# Senha do painel do organizador. Se vazia, uma senha temporária aparece no console.
app.admin.senha=${ADMIN_SENHA:}

# Porta (serviços de hospedagem costumam definir a variável PORT)
server.port=${PORT:8080}

# Banco de dados: por padrão um arquivo H2 local em ./data (zero instalação).
# Para usar PostgreSQL, defina DB_URL, DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/amigosecreto}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
