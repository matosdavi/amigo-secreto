spring.application.name=amigo-secreto

# Lê o arquivo .env da pasta do projeto, se existir (em produção as variáveis
# vêm do ambiente do Render). Copie o .env.example para .env para começar.
spring.config.import=optional:file:.env[.properties]

# Nome exibido nas telas (ex.: "Amigo Pijama da Família")
app.nome-evento=${NOME_EVENTO:Amigo Secreto}

# Senha do painel do organizador. Se vazia (só fora de produção), uma senha
# temporária aparece no console.
app.admin.senha=${ADMIN_SENHA:}

# Porta (o Render define a variável PORT)
server.port=${PORT:8080}

# Banco: vem do DATABASE_URL (veja config/ConfiguracaoDoAmbiente.java).
# Sem DATABASE_URL, usa um arquivo H2 local em ./data (zero instalação).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Pool pequeno e que solta conexões ociosas: o Neon pode "dormir" quando
# ninguém está usando, e isso economiza as horas de computação do plano grátis.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
